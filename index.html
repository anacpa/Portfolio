<!doctype html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel=" stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <title> My Website _ Design portfolio </title>
</head>

<body>
    <header>
        <section id="topRow">
            <nav class="menu">
                <a href="tickets.html"> Work</a>
                <a href="index.html"> About me</a>
                <a href="artwork.html"> Contact me</a>
            </nav>
            <div id="meuNome">
                <p>Ana<br>Catarina<br>Almeida</p>
            </div>
        </section>

        <section id="tituloInicial">
            <h1>hi<br>welcome to<br>my website</h1>
            <p>[ Design portfolio edition ]</p>
        </section>

        <section id="moveBar">
            <p>Visual Identidy</p>
            <p>Editorial</p>
            <p>UI/UX</p>
            <p>Events</p>
        </section>
    </header>

    <main>
        <!--  <section id="sideArrow"></section> -->
        <section id="topDM">
            <p>@Design and Multimedia<br>2025</p>
        </section>

        <section>
            <div id="tituloProjeto"></div>
            <div class="slider">
                <img src="imagens/ccdm.png" alt="foto 1" data-titulo="#titulo-ccdm" data-conteudo="#conteudo-ccdm">
                <img src="imagens/refresko.png" alt="foto 2">
                <img src="imagens/magazine.png" alt="foto 3">
                <img src="imagens/branding.png" alt="foto 4">
                <img src="imagens/convites.png" alt="foto 5">
                <img src="imagens/app.png" alt="foto 6">
                <img src="imagens/myportfolio.png" alt="foto 7">
                <img src="imagens/nowwhat.png" alt="foto 8">
            </div>
            <div id="conteudoProjeto"></div>
        </section>

        <!-- Templates de títulos -->
        <template id="titulo-ccdm">
            <div class="titulo-bloco">
                <svg width="30" height="30" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                </svg>
                <div>
                    <h2>Projeto CCDM</h2>
                    <p class="subtitulo">Identidade Visual</p>
                </div>
            </div>
        </template>

        <!-- Templates de conteúdos -->
        <template id="conteudo-ccdm">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p>Identidade visual desenvolvida para o Centro Cultural DM.</p>
                    <p>Inclui logotipo, manual de marca e material gráfico.</p>
                </div>
                <div>
                    <ul>
                        <li>Paleta de cores</li>
                        <li>Tipografia</li>
                        <li>Aplicações</li>
                    </ul>
                </div>
            </div>
        </template>

    </main>

    <footer>
        <div id="contactInfo">
            <p>Leiria & Coimbra, Portugal</p>
            <p>anacatarinapalmeida@gmail.com</p>
        </div>
        <div id="icons">
            <img src="imagens/icons/linkedin.svg">
            <img src="imagens/icons/behance.svg">
            <img src="imagens/icons/github.svg">
        </div>
    </footer>

    <script src="slider.js"></script>
</body>

</html>
